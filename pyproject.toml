[project]
name = "support-ticket-classifier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohamed Abdullah", email = "mohamed.abdullah9618@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.3.0",
    "langchain>=1.4.3",
    "langchain-core>=1.6.6",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.13",
    "loguru>=0.7.3",
    "luhn-validator>=1.2.0.post4",
    "phonenumbers>=9.0.40",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "tiktoken>=0.14.0",
]

[project.scripts]
support-ticket-classifier = "support_ticket_classifier:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.33",
]
